[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ojev"
version = "0.1.0"
description = "CPU-first OpenJev-style semantic decision scoring"
requires-python = ">=3.10"
dependencies = [
  "llama-cpp-python>=0.3.35",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ojev = "ojev.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
